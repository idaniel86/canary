[package]
name = "firmware"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h563zi", "memory-x", "time-driver-any", "defmt"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime"] }
embedded-hal-async = { version = "1.0.0" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
opt3001 = { path = "../opt3001", features = ["defmt"] }